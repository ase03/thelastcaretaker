server {
    listen 80;
    server_name tlc.aqua.lan;
    client_max_body_size 64m;

    location ^~ /api/ {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location = /world-catalog/25982825/pois.json {
        alias /opt/world-catalog-view/25982825/pois.json;
        add_header Cache-Control "no-cache";
    }

    location ~ "^/world-catalog/25982825/items/([a-f0-9]{64})\.json$" {
        alias /opt/world-catalog-view/25982825/$1.json;
        add_header Cache-Control "no-cache";
    }
    location ~ ^/world-catalog/25982825/images/([A-Za-z0-9_/-]+\.png)$ {
        alias /opt/world-catalog/25982825/images/$1;
        add_header Cache-Control "no-cache";
    }
    location /world-catalog/ { return 404; }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
